AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Heraldic website, uncached AI chat, and one scheduled AI Freedom Brief on private S3 and CloudFront.
Parameters:
  OpenAISecretArn:
    Type: String
    Description: ARN of an AWS Secrets Manager secret containing the OpenAI API key.
    AllowedPattern: '^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    ConstraintDescription: Supply the full secret ARN, not a plaintext key, secret name, or IAM wildcard.
  CloudFrontCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in us-east-1 for www.heraldic.cloud. DNS must point to the distribution after deployment.
  NewsScheduleExpression:
    Type: String
    Default: 'cron(0 9 * * ? *)'
    Description: EventBridge Scheduler expression, daily at 09:00 UTC by default.
  NewsScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  NewsOpenAIModel:
    Type: String
    Default: gpt-6-luna
    Description: Low-cost model supporting Responses API strict structured outputs.
  NewsLookbackHours:
    Type: Number
    Default: 72
    MinValue: 1
    MaxValue: 168
    Description: Maximum story age; modest overlap accommodates quieter news days and late RSS updates.
Conditions:
  UseCustomDomain: !Not [!Equals [!Ref CloudFrontCertificateArn, '']]
Resources:
  CloudFrontOriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared private header used to reject requests that bypass CloudFront.
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  HeraldicSiteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 30
      Architectures: [arm64]
      Environment:
        Variables:
          OPENAI_API_KEY: !Sub '{{resolve:secretsmanager:${OpenAISecretArn}:SecretString}}'
          OPENAI_MODEL: gpt-6-luna
          CLOUDFRONT_ORIGIN_TOKEN: !Sub '{{resolve:secretsmanager:${CloudFrontOriginSecret}:SecretString}}'
      Events:
        SiteRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HeraldicApi
            Path: /
            Method: ANY
        SiteProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HeraldicApi
            Path: /{proxy+}
            Method: ANY
  HeraldicApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  StaticSiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  StaticSiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-s3-origin'
        Description: CloudFront-only access to the private Heraldic static asset bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DailyNewsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/heraldic/${AWS::StackName}/daily-news'
      RetentionInDays: 14

  DailyNewsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishCurrentNewsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${StaticSiteBucket.Arn}/news/current.json'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OpenAISecretArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DailyNewsLogGroup.Arn

  DailyNewsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: news/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt DailyNewsRole.Arn
      LoggingConfig:
        LogGroup: !Ref DailyNewsLogGroup
        LogFormat: Text
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 0
      Environment:
        Variables:
          NEWS_BUCKET: !Ref StaticSiteBucket
          OPENAI_SECRET_ARN: !Ref OpenAISecretArn
          NEWS_OPENAI_MODEL: !Ref NewsOpenAIModel
          NEWS_LOOKBACK_HOURS: !Ref NewsLookbackHours

  DailyNewsScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup

  DailyNewsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt DailyNewsScheduleGroup.Arn
      Policies:
        - PolicyName: InvokeDailyNewsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DailyNewsFunction.Arn

  DailyNewsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref DailyNewsScheduleGroup
      ScheduleExpression: !Ref NewsScheduleExpression
      ScheduleExpressionTimezone: UTC
      State: !Ref NewsScheduleState
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt DailyNewsFunction.Arn
        RoleArn: !GetAtt DailyNewsSchedulerRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2

  NewsSnapshotCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-current-news'
        DefaultTTL: 300
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StaticAssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-assets'
        Comment: Cache public static assets while honoring their S3 Cache-Control headers.
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ChatNoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-chat-no-cache'
        Comment: Never cache AI requests or responses.
        DefaultTTL: 0
        MaxTTL: 0
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ChatOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-chat-request-headers'
        Comment: Forward the trusted viewer address and headers needed for same-origin request checks.
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Content-Type
            - CloudFront-Viewer-Address
            - Origin
            - Sec-Fetch-Site
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: none

  StaticAssetResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-static-security-headers'
        Comment: Security headers for assets delivered from the private S3 origin.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Permissions-Policy
              Value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
              Override: true

  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-directory-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect known page paths to their canonical trailing-slash URL.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (/^\/(mea|media|heraldic|leadership)$/.test(uri)) {
            return {
              statusCode: 308,
              statusDescription: 'Permanent Redirect',
              headers: { location: { value: uri + '/' } }
            };
          }
          return request;
        }

  HeraldicDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} website and chat CDN'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [UseCustomDomain, [www.heraldic.cloud], !Ref AWS::NoValue]
        Origins:
          - Id: StaticS3Origin
            DomainName: !GetAtt StaticSiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref StaticSiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiGatewayOrigin
            DomainName: !Sub '${HeraldicApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: X-Heraldic-Origin-Token
                HeaderValue: !Sub '{{resolve:secretsmanager:${CloudFrontOriginSecret}:SecretString}}'
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref StaticAssetCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /news/current.json
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NewsSnapshotCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ChatNoCachePolicy
            OriginRequestPolicyId: !Ref ChatOriginRequestPolicy
            Compress: true
          - PathPattern: '*.png'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.jpg'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.jpeg'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.webp'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.css'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.js'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.svg'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
          - PathPattern: '*.ico'
            TargetOriginId: StaticS3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref StaticAssetCachePolicy
            ResponseHeadersPolicyId: !Ref StaticAssetResponseHeaders
            Compress: true
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ErrorCachingMinTTL: 10

  StaticSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt StaticSiteBucket.Arn, !Sub '${StaticSiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${StaticSiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${HeraldicDistribution}'

Outputs:
  HeraldicUrl:
    Description: Website through CloudFront (set the optional certificate and DNS alias for the production hostname).
    Value: !If [UseCustomDomain, 'https://www.heraldic.cloud/', !Sub 'https://${HeraldicDistribution.DomainName}/']
  CloudFrontDomainName:
    Description: DNS target for the website CDN; point www.heraldic.cloud here when using the custom certificate.
    Value: !GetAtt HeraldicDistribution.DomainName
  CloudFrontDistributionId:
    Description: Distribution ID used by the deployment script to invalidate updated content.
    Value: !Ref HeraldicDistribution
  StaticSiteBucketName:
    Description: Private S3 bucket populated by the deployment script.
    Value: !Ref StaticSiteBucket
  DailyNewsFunctionName:
    Description: Invoke this Lambda manually to generate the first/current snapshot.
    Value: !Ref DailyNewsFunction
  DailyNewsScheduleName:
    Value: !Ref DailyNewsSchedule
  DailyNewsLogGroupName:
    Value: !Ref DailyNewsLogGroup
  NewsSnapshotUrl:
    Value: !If [UseCustomDomain, 'https://www.heraldic.cloud/news/current.json', !Sub 'https://${HeraldicDistribution.DomainName}/news/current.json']
